version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "Asia/Tokyo"
      open-pull-requests-limit: 10
      groups:
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
          development-dependencies:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"
          production-minor-and-patch:
              dependency-type: "production"
              update-types:
                  - "minor"
                  - "patch"
      ignore:
          # Semantic UI React 2.1.5 supports React through version 18.
          - dependency-name: "react"
            versions: [">=19"]
          - dependency-name: "react-dom"
            versions: [">=19"]
          - dependency-name: "@types/react"
            versions: [">=19"]
          - dependency-name: "@types/react-dom"
            versions: [">=19"]
      versioning-strategy: "increase"
      commit-message:
          prefix: "deps"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "Asia/Tokyo"
      commit-message:
          prefix: "ci"
