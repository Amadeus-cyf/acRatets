version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "Asia/Tokyo"
      open-pull-requests-limit: 10
      groups:
          development-dependencies:
              dependency-type: "development"
              update-types:
                  - "minor"
                  - "patch"
          production-minor-and-patch:
              dependency-type: "production"
              update-types:
                  - "minor"
                  - "patch"
      versioning-strategy: "increase"
      commit-message:
          prefix: "deps"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "Asia/Tokyo"
      commit-message:
          prefix: "ci"
